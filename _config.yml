# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing these this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: FeynCalc
email: info@feyncalc.org
description: > # this means to ignore newlines until "baseurl:"
  The FeynCalc home page, entry point to information about FeynCalc
  and related programs for High Energy Physics
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site
github_username:  feyncalc
#timezone: Europe/Berlin
include: ["_pages","FeynCalcBook","FeynCalcBookDev","Images","FeynCalcExamplesMD"]

github:
  repo: https://github.com/FeynCalc

# Build settings
markdown: kramdown

port: 3000 # change server port to 3000

# Search (see _data/sitesearch.yml). Listing `exclude` replaces Jekyll's
# defaults, so they are repeated here.
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  # the builder of the manuals' search indexes, not a page
  - tools/
  # of the sitesearch submodule the site needs search.js, palette.js and the
  # Jekyll index builder; the rest is its own documentation and checks
  - sitesearch/README.md
  - sitesearch/FORMAT.md
  - sitesearch/check-fold.js
  - sitesearch/check-prepare.js
  - sitesearch/check-say.js
  - sitesearch/check-math.js
  - sitesearch/node/

defaults:
  # The old forum archive (1600 posts from 2000–2015) stays out of the search:
  # it would triple the index, and the answers in it are about versions long gone.
  - scope:
      path: "OldForum"
    values:
      search: false
